#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  purge_unattached_blobs:
    class: ActiveStorage::PurgeUnattachedJob
    schedule: every day at 3am UTC

  cleanup_expired_sessions:
    class: SessionCleanupJob
    schedule: every day at 4am UTC

  cleanup_old_stripe_events:
    class: StripeEventCleanupJob
    schedule: every month at 5am UTC on the 1st

  purge_expired_requests:
    class: RequestRetentionJob
    schedule: every month at 6am UTC on the 1st

  backup_databases:
    class: DatabaseBackupJob
    schedule: every day at 2am UTC

  admin_weekly_digest:
    class: AdminDigestJob
    schedule: every monday at 7am UTC
